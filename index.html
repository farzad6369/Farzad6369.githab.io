<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadow Kingdom</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#050609;
  font-family:Tahoma,Arial;
  color:#fff
}

.scene{
  position:fixed;
  inset:0;
  background:url("market_scene.png") center/cover no-repeat
}

.shade{
  position:fixed;
  inset:0;
  background:radial-gradient(circle,transparent 35%,#0009)
}

.top{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:58px;
  background:#070a0ddd;
  border-bottom:1px solid #a27a35;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  z-index:3
}

.logo{
  color:#edcb70;
  font-weight:bold
}

.stats{
  display:flex;
  gap:5px
}

.pill{
  background:#151d28dd;
  border:1px solid #536071;
  border-radius:7px;
  padding:6px 8px;
  font-size:11px
}

.hot{
  position:fixed;
  z-index:2;
  border:1px solid transparent;
  border-radius:12px;
  cursor:pointer
}

.hot:hover{
  border-color:#e7bd5c;
  background:#e7bd5c22
}

.market{
  left:15%;
  bottom:18%;
  width:25%;
  height:35%
}

.arena{
  left:40%;
  bottom:25%;
  width:20%;
  height:28%
}

.shop{
  right:8%;
  bottom:20%;
  width:22%;
  height:35%
}

.hero{
  left:33%;
  bottom:0;
  width:34%;
  height:42%
}

.tag{
  position:absolute;
  bottom:4px;
  left:50%;
  transform:translateX(-50%);
  background:#080b0edd;
  border:1px solid #a27a35;
  border-radius:6px;
  padding:5px 8px;
  white-space:nowrap;
  font-size:11px;
  opacity:0
}

.hot:hover .tag{
  opacity:1
}

.panel{
  position:fixed;
  top:70px;
  width:210px;
  background:#090f17ee;
  border:1px solid #8b682f;
  border-radius:10px;
  padding:9px;
  z-index:4;
  font-size:11px
}

.left{left:9px}
.right{right:9px}

.panel h3{
  margin:0 0 7px;
  color:#edcb70
}

.item{
  background:#151e29;
  border:1px solid #334155;
  border-radius:7px;
  padding:7px;
  margin:5px 0
}

button{
  background:#b98b3d;
  border:0;
  border-radius:6px;
  padding:7px 9px;
  font-weight:bold;
  margin-top:5px;
  cursor:pointer
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:#070a0edd;
  border-top:1px solid #8b682f;
  z-index:5;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px
}

.slot{
  width:47px;
  height:47px;
  border:1px solid #8b682f;
  background:#131a24ee;
  border-radius:8px;
  display:grid;
  place-items:center;
  font-size:22px;
  cursor:pointer
}

#modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:10;
  align-items:center;
  justify-content:center;
  padding:15px
}

.box{
  width:min(400px,100%);
  background:#0d141e;
  border:1px solid #b2863c;
  border-radius:13px;
  padding:15px
}

@media(max-width:700px){

  .panel{
    display:none
  }

  .top{
    height:50px
  }

  .logo{
    font-size:13px
  }

  .pill{
    font-size:9px
  }

  .bottom{
    height:62px
  }

}
</style>
</head>

<body>

<div class="scene"></div>
<div class="shade"></div>

<div class="top">

  <div class="logo">
    🏰 Shadow Kingdom · بازار پادشاهی
  </div>

  <div class="stats">

    <div class="pill">
      👤 ShadowLord
    </div>

    <div class="pill">
      🪙 <b id="coins">2500</b>
    </div>

    <div class="pill">
      ❤️ <b id="lives">3</b>
    </div>

    <div class="pill">
      💎 USDT 0
    </div>

  </div>

</div>


<!-- بازارچه -->

<div
class="hot market"
onclick="show(
'🏺 بازارچه',
'بازار زنده، فروشنده‌ها و مایحتاج روزانه.',
'پرداخت واقعی و تتر در این نسخه فعال نیست.'
)">

<span class="tag">
🏺 بازارچه
</span>

</div>


<!-- میدان نبرد -->

<div
class="hot arena"
onclick="show(
'⚔️ میدان نبرد',
'مسابقه ۷۲ ساعته و مأموریت بین طرفین.',
'نسخه آزمایشی؛ بدون پرداخت واقعی.'
)">

<span class="tag">
⚔️ میدان نبرد
</span>

</div>


<!-- فروشگاه -->

<div
class="hot shop"
onclick="show(
'✨ فروشگاه',
'تجهیزات و کالاهای ویژه.',
'پرداخت واقعی غیرفعال است.'
)">

<span class="tag">
✨ فروشگاه
</span>

</div>


<!-- شخصیت -->

<div
class="hot hero"
onclick="show(
'👑 شخصیت اصلی',
'ShadowLord · سطح 1',
'تشکیل شخصیت پایه رایگان است.'
)">

<span class="tag">
👑 شخصیت
</span>

</div>


<!-- مأموریت -->

<div class="panel left">

<h3>
📜 مأموریت
</h3>

<div class="item">

مایحتاج روزانه را تهیه کن

<br>

پاداش: 300 🪙

<br>

<button onclick="mission()">
انجام مأموریت
</button>

</div>

</div>


<!-- بازیکنان -->

<div class="panel right">

<h3>
👥 بازیکنان
</h3>

<div class="item">
⚔️ Ardashir · Lv12
</div>

<div class="item">
🧙 Cyrus · Lv9
</div>

<div class="item">
🏹 Rostam · Lv16
</div>

<div class="item">
🔒 پرداخت واقعی غیرفعال
</div>

</div>


<!-- منوی پایین -->

<div class="bottom">

<div
class="slot"
onclick="show(
'🏺 بازارچه',
'مایحتاج روزانه و معامله بازیکنان',
'پرداخت واقعی غیرفعال است.'
)">
🏺
</div>

<div
class="slot"
onclick="mission()">
📜
</div>

<div
class="slot"
onclick="battle()">
⚔️
</div>

<div
class="slot"
onclick="show(
'👤 شخصیت',
'ShadowLord · سطح 1',
'ارتقا در نسخه آزمایشی فعال نیست.'
)">
👤
</div>

</div>


<!-- پنجره -->

<div id="modal">

<div class="box">

<h2 id="mt"></h2>

<div id="mc"></div>

<button onclick="modal.style.display='none'">
بستن
</button>

</div>

</div>


<script>

let coins = 2500;
let lives = 3;

const coinsEl =
document.getElementById("coins");

const livesEl =
document.getElementById("lives");

function show(title,text1,text2){

document.getElementById("mt").textContent =
title;

document.getElementById("mc").innerHTML =
'<div class="item">'+text1+
'</div><div class="item">'+text2+
'</div>';

document.getElementById("modal")
.style.display="flex";

}

function sync(){

coinsEl.textContent = coins;

livesEl.textContent = lives;

}

function mission(){

if(lives <= 0){

alert("جان کافی نیست");

return;

}

lives--;

coins += 300;

sync();

show(
"📜 مأموریت کامل شد",
"+300 سکه",
"هیچ پرداخت واقعی انجام نشد."
);

}

function battle(){

if(lives <= 0){

alert("جان کافی نیست");

return;

}

lives--;

coins += 500;

sync();

show(
"⚔️ نبرد آزمایشی",
"+500 سکه",
"پرداخت واقعی غیرفعال است."
);

}

setInterval(function(){

if(lives < 3){

lives++;

sync();

}

},3600000);

</script>

</body>
</html>
